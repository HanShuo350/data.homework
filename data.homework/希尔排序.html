<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>希尔排序可视化演示</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/theme/white.css">
    <style>
        :root {
            --card-width: 44px;
            --card-gap: 8px;
            --color-default: #3b82f6;
            --color-compare: #f59e0b;
            --color-swap: #ef4444;
            --color-sorted: #22c55e;
            --color-pivot: #8b5cf6;
            --color-gold: #fbbf24;
            --color-insert: #ec4899;
            --color-shell-gap: #14b8a6; /* 希尔排序专用颜色 */
        }

        .reveal {
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        }

        .reveal h1, .reveal h2, .reveal h3 {
            font-weight: 600;
            color: #1f2937;
            text-transform: none;
        }

        .reveal h1 { font-size: 2.2em; }
        .reveal h2 { font-size: 1.5em; margin-bottom: 0.5em; }

        .reveal .slides section {
            padding: 16px 20px;
        }

        /* Cover */
        .cover-slide h1 {
            font-size: 2.4em;
            color: #111827;
            margin-bottom: 0.3em;
        }
        .cover-slide p {
            font-size: 1.05em;
            color: #6b7280;
        }

        /* Controls */
        .algo-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .algo-controls input[type="text"] {
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 13px;
            width: 200px;
            outline: none;
        }

        .algo-controls button {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            background: #2563eb;
            color: #fff;
            transition: background 0.2s, transform 0.1s;
        }

        .algo-controls button:hover { background: #1d4ed8; }
        .algo-controls button:active { transform: translateY(1px); }
        .algo-controls button:disabled { background: #9ca3af; cursor: not-allowed; }

        .algo-controls .btn-secondary {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .algo-controls .btn-secondary:hover { background: #e5e7eb; }

        /* Visualization container */
        .viz-container {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            height: 300px;
            margin: 0 auto 12px;
            padding: 10px 10px 26px 10px;
            background: #f9fafb;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            max-width: 900px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        /* Card wrapper */
        .card-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            flex-shrink: 0;
            width: var(--card-width);
            margin-right: var(--card-gap);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1;
        }

        .card {
            width: var(--card-width);
            border-radius: 6px;
            background: linear-gradient(180deg, #60a5fa 0%, var(--color-default) 100%);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            transition: background 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
        }

        .card .val { font-size: 14px; line-height: 1; }

        .card-index-overlay {
            position: absolute;
            bottom: 6px;
            width: var(--card-width);
            text-align: center;
            font-size: 11px;
            color: #9ca3af;
            font-weight: 500;
            pointer-events: none;
            z-index: 10;
        }

        /* States */
        .card-wrapper.focused .card {
            box-shadow: 0 0 18px rgba(245, 158, 11, 0.8);
            z-index: 100;
        }

        /* ========== 希尔排序 — 间隔分组 ========== */
        .section.shell-viz .viz-container { padding-top: 30px; }

        .shell-viz .card-wrapper.comparing {
            z-index: 100;
        }
        @keyframes shell-compare-pop {
            0% { transform: translateY(0) scale(1); }
            60% { transform: translateY(-18px) scale(1.25); }
            100% { transform: translateY(-15px) scale(1.2); }
        }
        .shell-viz .card-wrapper.comparing .card {
            animation: shell-compare-pop 0.4s ease-out forwards;
            background: linear-gradient(180deg, #fbbf24 0%, var(--color-compare) 100%);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.9);
        }

        .shell-viz .card-wrapper.swapping .card {
            background: linear-gradient(180deg, #f87171 0%, var(--color-swap) 100%);
        }

        .shell-viz .card-wrapper.anim-swap-cross .card {
            animation: swap-cross 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .shell-viz .card-wrapper.sorted-shell .card {
            background: linear-gradient(180deg, #86efac 0%, var(--color-sorted) 100%);
            opacity: 0.7;
        }

        .shell-viz .card-wrapper.gap-group .card {
            background: linear-gradient(180deg, #5eead4 0%, var(--color-shell-gap) 100%);
            border: 2px solid #0f766e;
        }

        @keyframes swap-cross {
            0% { transform: rotateY(0deg) scale(1) translateX(0); }
            50% { transform: rotateY(90deg) scale(1.15) translateX(var(--swap-dir, 15px)); }
            100% { transform: rotateY(180deg) scale(1) translateX(0); }
        }

        /* Info panel */
        .info-panel {
            max-width: 800px;
            margin: 0 auto 10px;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            text-align: center;
            min-height: 40px;
        }
        .step-desc { font-size: 15px; color: #111827; margin-bottom: 3px; }
        .step-counter { font-size: 12px; color: #6b7280; }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .legend-item { display: inline-flex; align-items: center; gap: 5px; }
        .legend-dot { width: 11px; height: 11px; border-radius: 2px; }

        /* Playback controls */
        .playback {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }
        .playback button { padding: 8px 16px; border-radius: 8px; font-size: 13px; }

        /* Responsive */
        @media (max-width: 768px) {
            :root { --card-width: 32px; --card-gap: 4px; }
            .viz-container { height: 220px; }
            .reveal h2 { font-size: 1.2em; }
            .algo-controls input[type="text"] { width: 150px; }
        }
    </style>
</head>
<body>
    <div class="reveal">
        <div class="slides">
            <!-- Cover -->
            <section class="cover-slide">
                <h1>排序算法可视化演示</h1>
                <p>交互式逐步演示希尔排序 (Shell Sort)</p>
                <p style="margin-top: 40px; font-size: 0.9em; color: #9ca3af;">按 → 键或点击右下角箭头开始</p>
            </section>

            <!-- Shell Sort -->
            <section class="section shell-viz">
                <h2>希尔排序</h2>
                <div class="algo-controls">
                    <input type="text" class="array-input" placeholder="输入数字，如：9,8,7,6,5,4,3,2,1" value="9,8,7,6,5,4,3,2,1">
                    <button class="btn-generate">生成数组</button>
                    <button class="btn-reset btn-secondary">重置</button>
                </div>
                <div class="legend">
                    <span class="legend-item"><span class="legend-dot" style="background:var(--color-default)"></span>默认</span>
                    <span class="legend-item"><span class="legend-dot" style="background:var(--color-compare)"></span>比较</span>
                    <span class="legend-item"><span class="legend-dot" style="background:var(--color-swap)"></span>交换</span>
                    <span class="legend-item"><span class="legend-dot" style="background:var(--color-shell-gap)"></span>同组元素</span>
                    <span class="legend-item"><span class="legend-dot" style="background:var(--color-sorted)"></span>已排序</span>
                </div>
                <div class="viz-container" id="viz-shell"></div>
                <div class="info-panel">
                    <div class="step-desc" id="desc-shell">请点击“生成数组”开始</div>
                    <div class="step-counter" id="counter-shell">- / -</div>
                </div>
                <div class="playback">
                    <button class="btn-prev">上一步</button>
                    <button class="btn-play">自动播放</button>
                    <button class="btn-next">下一步</button>
                </div>
            </section>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.5.0/dist/reveal.js"></script>
    <script>
        Reveal.initialize({
            hash: true,
            slideNumber: 'c/t',
            transition: 'slide',
            width: 1100,
            height: 720,
            margin: 0.06
        });

        // ======================== Utilities ========================
        function parseInput(str) {
            return str.split(/[,，\s]+/)
                .map(s => s.trim())
                .filter(s => s !== '')
                .map(Number)
                .filter(n => !isNaN(n));
        }

        function clampArray(arr, maxLen = 20) {
            return arr.slice(0, maxLen);
        }

        function deepCopy(arr) {
            return arr.map(item => ({ ...item }));
        }

        function createSnapshot(array, description, focus = [], animation = '', extras = {}) {
            return {
                array: deepCopy(array),
                desc: description,
                focus,
                animation,
                extras
            };
        }

        // ======================== Shell Sort Step Generator ========================
        function generateShellSteps(arr) {
            const steps = [];
            const n = arr.length;
            const array = arr.map((v, i) => ({ value: v, state: 'default', id: i }));
            steps.push(createSnapshot(array, `初始数组: [${arr.join(', ')}]`));
            if (n <= 1) {
                array.forEach(x => x.state = 'sorted-shell');
                steps.push(createSnapshot(array, `排序完成！`));
                return steps;
            }

            // 计算初始间隔 (gap)
            let gap = Math.floor(n / 2);
            
            // 标记同组元素的颜色 (用于视觉辅助)
            const markGroup = (gapVal) => {
                array.forEach((item, idx) => {
                    if (item.state !== 'sorted-shell') {
                        item.state = (idx % gapVal === 0) ? 'gap-group' : 'default';
                    }
                });
            };

            while (gap > 0) {
                markGroup(gap);
                steps.push(createSnapshot(array, 
                    `========== 开始间隔为 ${gap} 的排序 ==========`, 
                    [], '', { gap: gap }));

                for (let i = gap; i < n; i++) {
                    let temp = array[i].value;
                    let tempId = array[i].id;
                    
                    // 显示当前待插入元素
                    steps.push(createSnapshot(array, 
                        `对 arr[${i}] (值=${temp}) 进行插入排序 (间隔 ${gap})`, 
                        [i], '', { gap: gap }));

                    let j = i;
                    // 比较并移动
                    while (j >= gap) {
                        steps.push(createSnapshot(array, 
                            `比较 arr[${j}]=${array[j].value} 和 arr[${j-gap}]=${array[j-gap].value} (间隔 ${gap})`, 
                            [j, j-gap], 'compare', { gap: gap }));

                        if (array[j - gap].value > temp) {
                            // 交换/移动
                            steps.push(createSnapshot(array, 
                                `arr[${j-gap}] 更大，将其移动到 arr[${j}]`, 
                                [j, j-gap], 'swap', { gap: gap }));
                            
                            // 实际移动操作
                            const movedItem = array[j - gap];
                            // 临时存储数组状态用于展示
                            const tempArray = array.map(item => ({ ...item }));
                            tempArray[j] = movedItem;
                            tempArray[j - gap] = { value: temp, state: 'default', id: tempId };
                            
                            // 强制更新显示状态
                            array[j] = movedItem;
                            array[j - gap] = { value: temp, state: 'gap-group', id: tempId };
                            j -= gap;
                        } else {
                            steps.push(createSnapshot(array, 
                                `arr[${j-gap}] ≤ ${temp}，停止移动`, 
                                [j], '', { gap: gap }));
                            break;
                        }
                    }

                    // 插入最终位置
                    array[j] = { value: temp, state: 'gap-group', id: tempId };
                    // 如果j!=i，说明发生了移动
                    if (j !== i) {
                        steps.push(createSnapshot(array, 
                            `将 ${temp} 插入到 arr[${j}]`, 
                            [j], '', { gap: gap }));
                    }
                }

                // 本轮gap排序完成，标记已排序 (但希尔排序中，只有最终gap=1完成才真正有序)
                if (gap === 1) {
                    array.forEach(x => x.state = 'sorted-shell');
                    steps.push(createSnapshot(array, `排序完成！`));
                } else {
                    steps.push(createSnapshot(array, 
                        `间隔 ${gap} 的排序完成`, 
                        [], '', { gap: gap }));
                }

                gap = Math.floor(gap / 2);
            }

            return steps;
        }

        // ======================== UI Controller ========================
        class Visualizer {
            constructor(type, containerId, descId, counterId, generatorFn) {
                this.type = type;
                this.container = document.getElementById(containerId);
                this.descEl = document.getElementById(descId);
                this.counterEl = document.getElementById(counterId);
                this.generatorFn = generatorFn;
                this.steps = [];
                this.currentIndex = -1;
                this.playing = false;
                this.timer = null;
                this.baseArray = [];

                const section = this.container.closest('section');
                this.inputEl = section.querySelector('.array-input');
                this.btnGenerate = section.querySelector('.btn-generate');
                this.btnReset = section.querySelector('.btn-reset');
                this.btnPrev = section.querySelector('.btn-prev');
                this.btnNext = section.querySelector('.btn-next');
                this.btnPlay = section.querySelector('.btn-play');

                this.bindEvents();
            }

            bindEvents() {
                this.btnGenerate.addEventListener('click', () => this.generate());
                this.btnReset.addEventListener('click', () => this.reset());
                this.btnPrev.addEventListener('click', () => this.prev());
                this.btnNext.addEventListener('click', () => this.next());
                this.btnPlay.addEventListener('click', () => this.togglePlay());
            }

            generate() {
                this.pause();
                let raw = parseInput(this.inputEl.value);
                if (raw.length === 0) {
                    this.descEl.textContent = '请输入有效的数字数组';
                    return;
                }
                raw = clampArray(raw, 20);
                if (raw.some(v => v < 0)) {
                    this.descEl.textContent = '请输入非负数';
                    return;
                }
                this.baseArray = [...raw];
                this.steps = this.generatorFn(raw);
                this.currentIndex = -1;
                this.renderEmpty();
                this.updateInfo();
            }

            reset() {
                this.pause();
                if (this.baseArray.length === 0) {
                    this.generate();
                    return;
                }
                this.steps = this.generatorFn(this.baseArray);
                this.currentIndex = -1;
                this.renderEmpty();
                this.updateInfo();
            }

            createCardWrapper(id, val) {
                const wrap = document.createElement('div');
                wrap.className = 'card-wrapper';
                wrap.dataset.id = id;

                const card = document.createElement('div');
                card.className = 'card';
                const maxVal = Math.max(...this.baseArray, 1);
                const unitH = 200 / maxVal;
                const h = Math.max(28, Math.round(val * unitH));
                card.style.height = `${h}px`;

                const valSpan = document.createElement('span');
                valSpan.className = 'val';
                valSpan.textContent = val;

                card.appendChild(valSpan);
                wrap.appendChild(card);

                return wrap;
            }

            renderEmpty() {
                this.container.innerHTML = '';
                this.baseArray.forEach((val, idx) => {
                    this.container.appendChild(this.createCardWrapper(idx, val));
                });
                const cardWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-width')) || 44;
                const cardGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-gap')) || 8;
                const stepSize = cardWidth + cardGap;
                const wrappers = Array.from(this.container.querySelectorAll('.card-wrapper'));
                const baseOffset = wrappers[0] ? wrappers[0].offsetLeft : 0;
                this.baseArray.forEach((_, idx) => {
                    const idxDiv = document.createElement('div');
                    idxDiv.className = 'card-index-overlay';
                    idxDiv.textContent = idx;
                    idxDiv.style.left = `${baseOffset + idx * stepSize}px`;
                    this.container.appendChild(idxDiv);
                });
            }

            renderStep(index) {
                if (index < 0 || index >= this.steps.length) return;
                const step = this.steps[index];
                const maxVal = Math.max(...this.baseArray, 1);
                const unitH = 200 / maxVal;
                const cardWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-width')) || 44;
                const cardGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-gap')) || 8;
                const stepSize = cardWidth + cardGap;

                // Ensure wrappers exist keyed by id
                let wrappers = Array.from(this.container.querySelectorAll('.card-wrapper'));
                const wrapperById = new Map();
                wrappers.forEach(w => wrapperById.set(Number(w.dataset.id), w));

                step.array.forEach(item => {
                    if (!wrapperById.has(item.id)) {
                        const wrap = this.createCardWrapper(item.id, item.value);
                        wrapperById.set(item.id, wrap);
                        this.container.appendChild(wrap);
                    }
                });

                // Reset all
                wrapperById.forEach(w => {
                    w.className = 'card-wrapper';
                    w.style.transform = '';
                    w.style.zIndex = '';
                    const card = w.querySelector('.card');
                    if (card) card.style.removeProperty('--swap-dir');
                });

                // Clean up old overlays
                this.container.querySelectorAll('.range-box, .vs-badge-overlay, .slot-placeholder-overlay, .card-index-overlay').forEach(el => el.remove());

                // Get base offset for absolute positioning
                wrappers = Array.from(this.container.querySelectorAll('.card-wrapper'));
                const baseOffset = wrappers[0] ? wrappers[0].offsetLeft : 0;

                // Position and style each card
                step.array.forEach((item, posIndex) => {
                    const w = wrapperById.get(item.id);
                    if (!w) return;
                    const dx = (posIndex - item.id) * stepSize;
                    w.style.transform = `translateX(${dx}px)`;

                    if (item.state && item.state !== 'default') {
                        w.classList.add(item.state);
                    }

                    const card = w.querySelector('.card');
                    const h = Math.max(28, Math.round(item.value * unitH));
                    card.style.height = `${h}px`;
                    card.querySelector('.val').textContent = item.value;

                    if (step.focus && step.focus.includes(posIndex)) {
                        w.classList.add('focused');
                        w.style.zIndex = '100';
                    }
                });

                // Apply animations to target cards only
                if (step.animation) {
                    const applyAnimToPos = (posIdx, animClass) => {
                        const item = step.array[posIdx];
                        if (!item) return;
                        const w = wrapperById.get(item.id);
                        if (w) w.classList.add(animClass);
                    };

                    if (step.animation === 'compare') {
                        step.focus.forEach(idx => applyAnimToPos(idx, 'comparing'));
                    } else if (step.animation === 'swap') {
                        step.focus.forEach(idx => applyAnimToPos(idx, 'swapping'));
                    }
                }

                // Card index overlays
                step.array.forEach((_, posIndex) => {
                    const idxDiv = document.createElement('div');
                    idxDiv.className = 'card-index-overlay';
                    idxDiv.textContent = posIndex;
                    idxDiv.style.left = `${baseOffset + posIndex * stepSize}px`;
                    this.container.appendChild(idxDiv);
                });

                // Gap display
                if (step.extras && step.extras.gap !== undefined) {
                    const gapDiv = document.createElement('div');
                    gapDiv.style.cssText = `
                        position: absolute;
                        top: 5px;
                        left: 50%;
                        transform: translateX(-50%);
                        background: rgba(20, 184, 166, 0.9);
                        color: white;
                        padding: 4px 12px;
                        border-radius: 20px;
                        font-size: 14px;
                        font-weight: bold;
                        z-index: 1000;
                    `;
                    gapDiv.textContent = `Gap = ${step.extras.gap}`;
                    this.container.appendChild(gapDiv);
                }

                this.descEl.textContent = step.desc;
                this.counterEl.textContent = `步骤 ${index + 1} / ${this.steps.length}`;
            }

            updateInfo() {
                if (this.currentIndex === -1) {
                    this.descEl.textContent = '请点击“下一步”开始演示';
                    this.counterEl.textContent = `- / ${this.steps.length}`;
                } else {
                    this.renderStep(this.currentIndex);
                }
            }

            next() {
                if (this.steps.length === 0) {
                    this.generate();
                    return;
                }
                if (this.currentIndex < this.steps.length - 1) {
                    this.currentIndex++;
                    this.renderStep(this.currentIndex);
                } else {
                    this.pause();
                }
            }

            prev() {
                if (this.steps.length === 0) return;
                if (this.currentIndex >= 0) {
                    this.currentIndex--;
                    if (this.currentIndex === -1) {
                        this.renderEmpty();
                        this.updateInfo();
                    } else {
                        this.renderStep(this.currentIndex);
                    }
                }
            }

            togglePlay() {
                if (this.playing) {
                    this.pause();
                } else {
                    this.play();
                }
            }

            play() {
                if (this.steps.length === 0) {
                    this.generate();
                    return;
                }
                this.playing = true;
                this.btnPlay.textContent = '暂停';
                if (this.currentIndex >= this.steps.length - 1) {
                    this.currentIndex = -1;
                }
                this.timer = setInterval(() => {
                    if (this.currentIndex < this.steps.length - 1) {
                        this.currentIndex++;
                        this.renderStep(this.currentIndex);
                    } else {
                        this.pause();
                    }
                }, 1100);
            }

            pause() {
                this.playing = false;
                this.btnPlay.textContent = '自动播放';
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }
        }

        // ======================== Initialize ========================
        document.addEventListener('DOMContentLoaded', () => {
            const visualizer = new Visualizer('shell', 'viz-shell', 'desc-shell', 'counter-shell', generateShellSteps);
            
            // 自动生成初始数据
            visualizer.generate();

            Reveal.on('slidechanged', () => {
                visualizer.pause();
            });
        });
    </script>
</body>
</html>
